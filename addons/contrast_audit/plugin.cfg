[plugin]

name="Contrast Audit Lite"
description="UI readability audit for Godot 4 (free Lite version). Lays out the scene you have open with the game's own theme and measures WCAG 2.1 contrast, resolved font sizes and clickable areas - including the hover, pressed, disabled and focus states a screenshot never shows. The full version adds checking every scene at once and Markdown/JSON reports."
author="Idle Hands"
version="0.1.1-lite"
script="plugin.gd"
